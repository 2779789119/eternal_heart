buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'eclipse'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '6.0.25'
}

// Mixin 支持：与成熟模组一致的底层注入能力（refmap 由注解处理器在编译期生成）
apply plugin: 'org.spongepowered.mixin'

version = '1.19.40'
group = 'com.eternal_heart'
archivesBaseName = 'eternal_heart-永恒之心'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// Regression tests have a separate source set and are not included in the release JAR.
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        gameTestServer {
            workingDirectory project.file('run-gametest')
            property 'forge.enabledGameTestNamespaces', 'eternal_heart'
            mods {
                eternal_heart {
                    source sourceSets.main
                    source sourceSets.gametest
                }
            }
        }
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                eternal_heart {
                    source sourceSets.main
                }
            }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                eternal_heart {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    maven {
        url = "https://maven.theillusivec4.top/"
    }
    maven {
        url = 'https://repo.spongepowered.org/repository/maven-public/'
    }
    flatDir {
        dirs 'libs'
    }
}

// 生成 eternal_heart.refmap.json：把源码里的官方名映射到生产环境的 SRG 名
mixin {
    add sourceSets.main, 'eternal_heart.refmap.json'
    config 'eternal_heart.mixins.json'
}

// refmap 的落点由我们自己掌控，且**必须在执行期改写**。
//
// 注解处理器默认写进编译任务的临时目录（build/tmp/compileJava）——那正是 Gradle 会清理、
// 也是历史上「jar 重打但 refmap 缺失」导致正式环境启动崩溃（No refMap loaded，1.14.0）
// 的根源。MixinGradle 是在配置期注入 -AoutRefMapFile 的，配置期改写会被它覆盖，
// 因此这里放在 doFirst（执行期、最后生效）替换成稳定路径。
//
// 同时把它声明为编译输出：文件一旦缺失，Gradle 判定 compileJava 非最新并重跑，
// 注解处理器随即重新生成 → 自动闭环，不再依赖任何"复制"步骤的时序。
def mixinRefmap = file("${buildDir}/mixin-refmap/eternal_heart.refmap.json")

tasks.named('compileJava', JavaCompile).configure {
    doFirst {
        options.compilerArgs.removeIf { it.startsWith('-AoutRefMapFile=') }
        options.compilerArgs.add('-AoutRefMapFile=' + mixinRefmap.absolutePath)
    }
    outputs.file(mixinRefmap)
}

dependencies {
    minecraft "net.minecraftforge:forge:1.20.1-47.4.15"

    // Mixin 注解处理器：编译期生成 refmap（官方名 → SRG 名）；生产环境注入完全依赖它
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // Curios API
    implementation fg.deobf("top.theillusivec4.curios:curios-forge:5.14.1+1.20.1")
    compileOnly fg.deobf("top.theillusivec4.curios:curios-forge:5.14.1+1.20.1:api")
    runtimeOnly fg.deobf("top.theillusivec4.curios:curios-forge:5.14.1+1.20.1")

    // MineFargo - local hard dependency
    // 说明：其 JarJar 内嵌的 expandability 在开发环境 mixin 不兼容（fluidcollision.BlockStateBaseMixin），
    // 会导致 gametest 服务器启动失败；跑测试时用 -PnoMineFargo 把它移出 classpath 即可。
    if (!project.hasProperty('noMineFargo')) {
        implementation fg.deobf(files("libs/mine_fargo-1.2.42-all.jar"))
    }

    // === 可选模组集成（运行时按需激活，编译期仅类型检查） ===
    // FTB Ultimine - 连锁挖掘
    compileOnly fg.deobf(files("libs/ftb-ultimine-forge-2001.1.8.jar"))
    // Caelus - 鞘翅飞行 API
    compileOnly fg.deobf(files("libs/caelus-forge-3.2.0+1.20.1.jar"))
    // Pehkui - 体型缩放
    compileOnly fg.deobf(files("libs/Pehkui-3.8.2+1.20.1-forge.jar"))
}

jar {
    // 显式把 refmap 打进产物根目录：不依赖 MixinGradle 的注入时机（增量构建下会丢失）
    from(mixinRefmap) {
        rename { 'eternal_heart.refmap.json' }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes([
            "Specification-Title": "eternal_heart",
            "Specification-Vendor": "EternalHeart",
            "Specification-Version": "1",
            "Implementation-Title": project.name,
            "Implementation-Version": project.jar.archiveVersion,
            "Implementation-Vendor": "EternalHeart",
            "MixinConfigs": "eternal_heart.mixins.json",
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('check').configure {
    dependsOn tasks.named('compileGametestJava')
}

// 产物自检：生产环境的 mixin 注入完全依赖 refmap，缺它会在启动时直接崩溃
// （"No refMap loaded"）。这里在 build 结束时校验产物，避免问题 jar 流出。
tasks.named('build').configure {
    doLast {
        def artifact = tasks.named('jar').get().archiveFile.get().asFile
        def zip = new java.util.zip.ZipFile(artifact)
        try {
            ['eternal_heart.mixins.json', 'eternal_heart.refmap.json'].each { name ->
                if (zip.getEntry(name) == null) {
                    throw new GradleException("构建产物 ${artifact.name} 缺少 ${name}：生产环境 mixin 注入会失败")
                }
            }
        } finally {
            zip.close()
        }
    }
}

tasks.named('processResources').configure {
    // 资源里也带一份 refmap（jar 打包资源时自然带上），与 jar 的显式 from 互为保险
    dependsOn tasks.named('compileJava')
    from(mixinRefmap) {
        rename { 'eternal_heart.refmap.json' }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    inputs.property 'mod_version', project.version
    inputs.property 'mine_fargo_mandatory', project.hasProperty('noMineFargo') ? 'false' : 'true'
    filesMatching('META-INF/mods.toml') {
        expand mod_version: project.version,
               mine_fargo_mandatory: project.hasProperty('noMineFargo') ? 'false' : 'true'
    }
}
