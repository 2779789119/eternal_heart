org.gradle.jvmargs=-Xmx3G
# daemon=false 时每次构建都要冷启动 JVM、重跑 ForgeGradle 配置阶段（每次多等 30 秒以上）。
# 改回 true 复用常驻守护进程；若要恢复"不留常驻进程"，把下面一行改回 false。
org.gradle.daemon=true
# 复用任务产物缓存（配合不再 clean 的构建脚本，未改动的任务直接 UP-TO-DATE）
org.gradle.caching=true
org.gradle.parallel=true
minecraft.version=1.20.1
forge.version=47.1.3
